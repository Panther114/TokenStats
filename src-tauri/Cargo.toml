[package]
name = "tokenstats"
version = "1.2.0"
description = "Unified token usage dashboard for Claude Code, Codex, OpenCode and DeepSeek Harness"
authors = ["TokenStats"]
edition = "2021"

[package.metadata.tauri-winres]
OriginalFilename = "TokenStats.exe"
InternalName = "TokenStats"
ProductName = "TokenStats"
FileDescription = "TokenStats"

[lib]
name = "tokenstats_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "tokenstats"
path = "src/main.rs"

[[bin]]
name = "tokenstats-cli"
path = "src/cli.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zstd = { version = "0.13", default-features = false }
rusqlite = { version = "0.37", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
postcard = { version = "1", default-features = false, features = ["use-std"] }
rayon = "1"
memchr = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 2
